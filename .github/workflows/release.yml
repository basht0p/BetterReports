name: Release BetterReports
# Builds and tests both plugins, publishes a GitHub release with the plugin ZIPs and
# checksums, and pushes OpenSearch and Dashboards images with the plugins installed.
# Run it from the Actions tab (or push a vX.Y.Z tag). The version comes from package.json.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          test -f "docs/releases/$version.md" || { echo "Missing docs/releases/$version.md"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" != tag ] && [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then echo "Run releases from the default branch"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/betterreports" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:companion
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push OpenSearch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/opensearch.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.image_prefix }}-opensearch:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image_prefix }}-opensearch:latest
          labels: |
            org.opencontainers.image.title=BetterReports OpenSearch
            org.opencontainers.image.description=OpenSearch ${{ steps.version.outputs.version }} with the BetterReports companion plugin
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Push Dashboards image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboards.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.image_prefix }}-dashboards:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image_prefix }}-dashboards:latest
          labels: |
            org.opencontainers.image.title=BetterReports OpenSearch Dashboards
            org.opencontainers.image.description=OpenSearch Dashboards ${{ steps.version.outputs.version }} with the BetterReports plugin
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PREFIX: ${{ steps.version.outputs.image_prefix }}
        run: |
          notes=$(mktemp)
          cat "docs/releases/$VERSION.md" > "$notes"
          printf '\n## Container images\n\n```\n%s-opensearch:%s\n%s-dashboards:%s\n```\n' "$PREFIX" "$VERSION" "$PREFIX" "$VERSION" >> "$notes"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "BetterReports $VERSION" --notes-file "$notes" \
            "build/betterReports-$VERSION.zip" "build/betterReports-$VERSION.zip.sha256" \
            "build/betterreports-opensearch-$VERSION.zip" "build/betterreports-opensearch-$VERSION.zip.sha256"
